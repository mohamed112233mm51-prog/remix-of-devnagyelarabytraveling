name: Fix execution atomic duplicate ids

on:
  push:
    branches: [devo]
    paths:
      - scripts/_fix_execution_atomic_duplicate_ids.py
      - .github/workflows/fix-execution-atomic-duplicate-ids.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean duplicate ids
        run: python3 scripts/_fix_execution_atomic_duplicate_ids.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/executionPosting.ts
          git commit -m "Clean execution atomic row ids"
          git pull --rebase origin devo
          git push origin devo
