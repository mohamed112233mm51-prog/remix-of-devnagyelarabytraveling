name: Apply direct transfer methods and agent-side flow

on:
  push:
    branches: [devo]
    paths:
      - scripts/_patch_direct_transfer_methods_agent_side.py
      - .github/workflows/apply-direct-transfer-methods-agent-side.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply guarded follow-up patch
        run: python3 scripts/_patch_direct_transfer_methods_agent_side.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Direct-transfer regression checks
        run: node scripts/test-agent-company-direct.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit verified follow-up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-direct-transfer-methods-agent-side.yml scripts/_patch_direct_transfer_methods_agent_side.py
          git add \
            src/lib/directTransferPaymentMethod.ts \
            src/lib/agentCompanyDirectTransfer.ts \
            src/components/PaymentSplits.tsx \
            src/components/AgentPaymentForm.tsx \
            src/features/companies/LegacyCompaniesRoute.tsx \
            src/lib/financialSummary.ts \
            scripts/test-agent-company-direct.mjs \
            package-lock.json
          git commit -m "Add direct payment methods and agent-side company transfers"
          git pull --rebase origin devo
          git push origin HEAD:devo
