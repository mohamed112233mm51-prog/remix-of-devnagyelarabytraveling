name: Remove export branding

on:
  push:
    branches:
      - devo
    paths:
      - .github/workflows/remove-export-branding.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped export patch
        run: python3 .github/patch-export-branding.py

      - name: Verify scoped diff
        run: |
          changed="$(git diff --name-only)"
          test "$changed" = "src/lib/exportStatement.ts"
          git diff --check
          grep -q 'REPORT HEADER (no logo/company branding)' src/lib/exportStatement.ts
          ! grep -q 'تم التوليد آلي' src/lib/exportStatement.ts
          ! grep -q 'branding.logoUrl' src/lib/exportStatement.ts
          ! grep -q 'branding.logoDataUrl' src/lib/exportStatement.ts

      - name: Commit export change and remove temporary files
        run: |
          rm -f .github/workflows/remove-export-branding.yml .github/patch-export-branding.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/exportStatement.ts .github/workflows/remove-export-branding.yml .github/patch-export-branding.py
          git diff --cached --check
          git commit -m "fix(exports): remove company branding from PDF and Excel"
          git push origin devo
