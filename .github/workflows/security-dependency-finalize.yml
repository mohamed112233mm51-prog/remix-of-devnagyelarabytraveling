name: Security dependency finalize

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-dependency-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Apply validated dependency set and regenerate lock
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('package.json')
          d = json.loads(p.read_text())
          d['dependencies']['xlsx'] = 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
          d['dependencies']['@cloudflare/vite-plugin'] = '^1.51.2'
          d['dependencies']['@supabase/supabase-js'] = '^2.112.2'
          d['dependencies']['nitro'] = '3.0.260610-beta'
          d['devDependencies']['@lovable.dev/vite-tanstack-config'] = '2.10.0'
          d['devDependencies']['vite'] = '^7.3.6'
          d.setdefault('overrides', {})['uuid'] = '11.1.1'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n')
          PY
          rm -rf node_modules bun.lock
          bun install
          bun pm why uuid

      - name: Require zero Bun advisories
        run: |
          set +e
          bun audit --json > /tmp/audit.json 2>/tmp/audit.err
          audit_exit=$?
          set -e
          cat /tmp/audit.err || true
          node - <<'JS'
          const fs = require('fs');
          let d;
          try { d = JSON.parse(fs.readFileSync('/tmp/audit.json', 'utf8')); }
          catch (e) { console.error('Invalid bun audit JSON', e); process.exit(2); }
          let total = 0;
          for (const [pkg, items] of Object.entries(d || {})) {
            total += items.length;
            console.log(`${pkg}: ${items.length} advisory(s)`);
          }
          console.log(`SECURITY_AUDIT_TOTAL=${total}`);
          if (total !== 0) process.exit(1);
          JS
          if [ "$audit_exit" -ne 0 ]; then exit "$audit_exit"; fi

      - name: Verify ExcelJS compatibility with uuid override
        run: |
          bun --eval '
            import ExcelJS from "exceljs";
            const wb = new ExcelJS.Workbook();
            const ws = wb.addWorksheet("Test");
            ws.addRow(["name", "amount"]); ws.addRow(["Ahmed", 125]);
            const buf = await wb.xlsx.writeBuffer();
            const wb2 = new ExcelJS.Workbook(); await wb2.xlsx.load(buf);
            if (wb2.worksheets[0].getCell("A2").text !== "Ahmed") throw new Error("ExcelJS read/write failed");
            console.log("ExcelJS smoke OK", buf.byteLength);
          '

      - name: Verify SheetJS compatibility
        run: |
          bun --eval '
            import * as XLSX from "xlsx";
            const ws = XLSX.utils.aoa_to_sheet([["name","amount"],["Ahmed",125]]);
            const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Data");
            const out = XLSX.write(wb, { type: "array", bookType: "xlsx" });
            const read = XLSX.read(out, { type: "array" });
            const rows = XLSX.utils.sheet_to_json(read.Sheets[read.SheetNames[0]], { defval: "", raw: false });
            if (XLSX.version !== "0.20.3" || rows.length !== 1 || rows[0].name !== "Ahmed") throw new Error("SheetJS smoke failed");
            console.log("SheetJS", XLSX.version, "smoke OK");
          '

      - name: Build application
        run: bun run build

      - name: Verify dependency change scope
        run: |
          git diff --check
          test -f bun.lock
          grep -q 'cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz' package.json
          grep -q '"uuid": "11.1.1"' package.json
          # routeTree may be regenerated by build; never include it in this dependency commit.
          git checkout -- src/routeTree.gen.ts || true
          changed="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$changed" = "bun.lock package.json "

      - name: Commit secure dependency resolution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "fix(security): refresh vulnerable dependencies"
          git reset --hard HEAD
          git clean -fdx
          git fetch origin devo
          git rebase origin/devo
          git push origin HEAD:devo
