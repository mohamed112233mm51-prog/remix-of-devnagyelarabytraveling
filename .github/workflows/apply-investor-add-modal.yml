name: Apply investor add modal

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/apply-investor-add-modal.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped modal update
        run: python3 scripts/apply-investor-add-modal.py

      - name: Verify whitespace
        run: git diff --check

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
        run: bun run build

      - name: Commit scoped update
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/routeTree.gen.ts || true
          unexpected="$(git diff --name-only | grep -Ev '^src/routes/investors\.tsx$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/investors.tsx
          git rm .github/workflows/apply-investor-add-modal.yml scripts/apply-investor-add-modal.py
          git diff --cached --check
          git commit -m 'fix(owner-account): open add investor form in modal'
          git push origin devo
