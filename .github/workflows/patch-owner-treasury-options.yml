name: Patch owner treasury options

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/patch-owner-treasury-options.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped treasury option patch
        run: python3 scripts/_patch_owner_treasury_options.py

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/routes/investors.tsx"
          grep -q 'resolveCompanyCashBoxForSplit(boxes, "EGP", "company_cash")' src/routes/investors.tsx
          grep -q 'resolveCompanyCashBoxForSplit(boxes, "EGP", "company_instapay")' src/routes/investors.tsx
          grep -q 'method_key === "company_instapay"' src/routes/investors.tsx

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
        run: bun run build

      - name: Commit scoped feature
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/routeTree.gen.ts || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/investors.tsx
          git rm .github/workflows/patch-owner-treasury-options.yml scripts/_patch_owner_treasury_options.py
          git diff --cached --check
          git commit -m 'fix(investors): offer cash and InstaPay treasuries for owner funding'
          git push origin devo
