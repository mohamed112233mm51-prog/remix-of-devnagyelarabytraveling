name: Verify merchant accounting branch

on:
  push:
    branches: [merchant-accounting-stability]
    paths:
      - '.github/workflows/verify-merchant-accounting-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: install
        run: bun install --frozen-lockfile
      - id: build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
        run: bun run build
      - id: typecheck
        run: bunx tsc --noEmit
      - name: Record result and remove workflow
        if: always()
        run: |
          mkdir -p .github/build-results
          {
            echo "commit=${GITHUB_SHA}"
            echo "install=${{ steps.install.outcome }}"
            echo "build=${{ steps.build.outcome }}"
            echo "typecheck=${{ steps.typecheck.outcome }}"
            echo "job=${{ job.status }}"
          } > .github/build-results/merchant-accounting.txt
          rm .github/workflows/verify-merchant-accounting-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-results/merchant-accounting.txt .github/workflows/verify-merchant-accounting-once.yml
          git commit -m 'ci: record merchant accounting verification' || true
          git push origin HEAD:merchant-accounting-stability
