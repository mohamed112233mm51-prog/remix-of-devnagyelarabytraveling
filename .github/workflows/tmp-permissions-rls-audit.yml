name: Temporary permissions RLS audit

on:
  push:
    branches:
      - tmp-permissions-hardening-ci
  pull_request:
    branches:
      - permissions-hardening

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-permissions-hardening-ci
          fetch-depth: 0

      - name: Audit financial RLS and permission SQL
        shell: bash
        run: |
          set -euo pipefail
          echo '=== PROFILE PRIVILEGE-ESCALATION PROTECTION ==='
          grep -RInEi 'profiles|is_super_admin|permissions' supabase/migrations | grep -Ei 'trigger|function|policy|update|old\.|new\.|security definer|raise exception' || true
          echo '=== LATEST PROFILE / USER_ROLE CHANGES ==='
          grep -RInEi 'profiles|user_roles' supabase/migrations | grep -Ei 'drop policy|create policy|create trigger|drop trigger|create or replace function|revoke|grant' || true
          echo '=== FINANCIAL PERMISSION-AWARE POLICIES ==='
          grep -RInEi 'transactions_perm_|company_transactions_perm_|merchant_collections_perm_|supplier_transactions_perm_|investor_transactions_perm_|expense_deductions_perm_|usd_treasury_perm_|payment_splits_perm_|cash_boxes_perm_' supabase/migrations || true
