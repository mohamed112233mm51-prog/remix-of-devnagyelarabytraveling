name: Security write path audit

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-write-path-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
      - name: Audit financial write paths
        run: |
          echo '=== payment_splits write calls ==='
          grep -Rni --include='*.ts' --include='*.tsx' 'from("payment_splits")' src || true
          echo '=== cash_boxes calls ==='
          grep -Rni --include='*.ts' --include='*.tsx' 'from("cash_boxes")' src || true
          echo '=== transactions calls ==='
          grep -Rni --include='*.ts' --include='*.tsx' 'from("transactions")' src || true
          echo '=== company_transactions calls ==='
          grep -Rni --include='*.ts' --include='*.tsx' 'from("company_transactions")' src || true
          echo '=== merchant_cash_collections calls ==='
          grep -Rni --include='*.ts' --include='*.tsx' 'from("merchant_cash_collections")' src || true
          echo '=== currency_supplier_transactions calls ==='
          grep -Rni --include='*.ts' --include='*.tsx' 'from("currency_supplier_transactions")' src || true
          echo '=== investor_transactions calls ==='
          grep -Rni --include='*.ts' --include='*.tsx' 'from("investor_transactions")' src || true
          echo '=== expense_deductions calls ==='
          grep -Rni --include='*.ts' --include='*.tsx' 'from("expense_deductions")' src || true
          echo '=== usd_treasury_transactions calls ==='
          grep -Rni --include='*.ts' --include='*.tsx' 'from("usd_treasury_transactions")' src || true
