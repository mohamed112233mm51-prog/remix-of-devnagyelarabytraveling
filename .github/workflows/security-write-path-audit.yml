name: Security write path audit

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-write-path-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
      - name: Audit SECURITY DEFINER declarations and grants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = sorted(Path('supabase/migrations').glob('*.sql'))
          print('=== SECURITY DEFINER declarations ===')
          for p in files:
              text = p.read_text(encoding='utf-8', errors='ignore')
              for m in re.finditer(r'CREATE\s+OR\s+REPLACE\s+FUNCTION\s+([^\n]+).*?SECURITY\s+DEFINER', text, re.I|re.S):
                  sig = ' '.join(m.group(1).split())
                  start = max(0, m.start()-300)
                  end = min(len(text), m.end()+600)
                  tail = text[m.end():min(len(text), m.end()+2500)]
                  grants = re.findall(r'(?im)^\s*(REVOKE|GRANT)\b[^;]*;', tail)
                  print(f'{p.name}: {sig}')
                  # Print grant/revoke statements near the declaration when present.
                  for gm in re.finditer(r'(?im)^\s*(?:REVOKE|GRANT)\b[^;]*;', tail):
                      stmt = ' '.join(gm.group(0).split())
                      print('  ', stmt[:500])
          print('=== all function EXECUTE grants/revokes mentioning authenticated/anon/public ===')
          for p in files:
              text = p.read_text(encoding='utf-8', errors='ignore')
              for line in text.splitlines():
                  up = line.upper()
                  if ('FUNCTION' in up and ('GRANT' in up or 'REVOKE' in up) and any(x in up for x in ['AUTHENTICATED','ANON','PUBLIC'])):
                      print(f'{p.name}: {line.strip()}')
          PY
