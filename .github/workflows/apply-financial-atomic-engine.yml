name: Apply atomic financial engine

on:
  push:
    branches: [devo]
    paths:
      - scripts/_patch_financial_atomic_engine.py
      - .github/workflows/apply-financial-atomic-engine.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply atomic engine patch
        run: python3 scripts/_patch_financial_atomic_engine.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit atomic engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/financialEngine.ts
          if git diff --cached --quiet; then
            echo "No engine changes to commit"
          else
            git commit -m "Route financial engine through atomic RPC"
            git pull --rebase origin devo
            git push origin devo
          fi
