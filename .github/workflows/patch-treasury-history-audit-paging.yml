name: Patch treasury history and audit paging

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/patch-treasury-history-audit-paging.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped patch
        run: python3 scripts/_patch_treasury_history_audit_paging.py

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'src/routes/audit-log.tsx' \
            'src/routes/reports.tsx' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          fi
          grep -q 'سجل تسويات وتحويلات الخزائن' src/routes/reports.tsx
          grep -q 'source_table !== "cash_box_transfer"' src/routes/reports.tsx
          grep -q '.range(offset, offset + PAGE_SIZE - 1)' src/routes/audit-log.tsx
          ! grep -q '.limit(2000)' src/routes/audit-log.tsx

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
        run: bun run build

      - name: Commit scoped feature
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/routeTree.gen.ts || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/reports.tsx src/routes/audit-log.tsx
          git rm .github/workflows/patch-treasury-history-audit-paging.yml scripts/_patch_treasury_history_audit_paging.py
          git diff --cached --check
          git commit -m 'feat(reports): add treasury operation history and full audit paging'
          git push origin devo
