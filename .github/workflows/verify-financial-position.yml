name: Verify financial position

on:
  push:
    branches: [devo]
    paths:
      - 'src/hooks/useFinancialPosition.ts'
      - 'src/hooks/useCompleteAgentsSummary.ts'
      - 'src/lib/financialSummary.ts'
      - 'src/hooks/useCompleteMerchantFinancialData.ts'
      - '.github/workflows/verify-financial-position.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
