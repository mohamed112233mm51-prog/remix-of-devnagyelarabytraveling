name: Security dependency audit

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-dependency-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Trace vulnerable package parents
        run: |
          for pkg in xlsx undici sharp ws postcss nanoid js-yaml brace-expansion dompurify esbuild tmp uuid @babel/core vite; do
            echo "===== WHY $pkg ====="
            bun pm why "$pkg" || true
          done
      - name: Outdated direct dependencies
        run: bun outdated || true
      - name: Bun security audit summary
        run: |
          set +e
          bun audit --json > /tmp/audit.json 2>/tmp/audit.err
          echo "bun audit exit=$?"
          cat /tmp/audit.err || true
          node - <<'JS'
          const fs=require('fs');
          const p='/tmp/audit.json';
          if(!fs.existsSync(p)) process.exit(0);
          let d={}; try{d=JSON.parse(fs.readFileSync(p,'utf8'))}catch{process.exit(0)}
          for(const [pkg,items] of Object.entries(d)){
            console.log(`${pkg}: ${items.length} advisory(s) -> ${[...new Set(items.map(x=>x.severity))].join(', ')}`)
          }
          JS
          exit 0
