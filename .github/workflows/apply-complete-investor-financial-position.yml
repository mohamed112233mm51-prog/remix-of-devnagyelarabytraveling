name: Apply complete investor financial position fix

on:
  push:
    branches: [devo]
    paths:
      - scripts/_patch_complete_investor_financial_position.py
      - src/hooks/useCompleteFinancialTables.ts
      - .github/workflows/apply-complete-investor-financial-position.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python3 scripts/_patch_complete_investor_financial_position.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/investors.tsx src/hooks/useFinancialPosition.ts src/hooks/useCompleteFinancialTables.ts
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "fix investors: load complete financial history"
            git push origin devo
          fi
