name: Security dependency hardening trial v3

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-dependency-trial-v3.yml'

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
      - uses: oven-sh/setup-bun@v2
      - name: Apply conservative parent upgrades locally
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d['dependencies']['xlsx']='https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
          d['dependencies']['@cloudflare/vite-plugin']='^1.51.2'
          d['dependencies']['@supabase/supabase-js']='^2.112.2'
          d['dependencies']['nitro']='3.0.260610-beta'
          d['devDependencies']['@lovable.dev/vite-tanstack-config']='2.10.0'
          d['devDependencies']['vite']='^7.3.6'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf node_modules
          bun install
      - name: Verify SheetJS 0.20.3 functionality
        run: |
          bun --eval '
            import * as XLSX from "xlsx";
            const ws = XLSX.utils.aoa_to_sheet([["name","amount"],["Ahmed",125]]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Data");
            const out = XLSX.write(wb,{type:"array",bookType:"xlsx"});
            const read = XLSX.read(out,{type:"array"});
            const rows = XLSX.utils.sheet_to_json(read.Sheets[read.SheetNames[0]],{defval:"",raw:false});
            console.log(XLSX.version, JSON.stringify(rows));
            if (XLSX.version !== "0.20.3") throw new Error(`wrong SheetJS version ${XLSX.version}`);
            if (rows.length!==1 || rows[0].name!=="Ahmed") throw new Error("SheetJS smoke test failed");
          '
      - name: Build candidate
        run: bun run build
      - name: Audit candidate
        run: |
          set +e
          bun audit --json > /tmp/audit.json 2>/tmp/audit.err
          code=$?
          echo "bun audit exit=$code"
          cat /tmp/audit.err || true
          node - <<'JS'
          const fs=require('fs'); let d={};
          try{d=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'))}catch{}
          let total=0, high=0, moderate=0, low=0;
          for(const [pkg,items] of Object.entries(d)){
            total+=items.length;
            for(const x of items){if(x.severity==='high')high++;else if(x.severity==='moderate')moderate++;else low++;}
            console.log(`${pkg}: ${items.length} -> ${[...new Set(items.map(x=>x.severity))].join(', ')}`)
          }
          console.log(`TOTAL=${total} HIGH=${high} MODERATE=${moderate} LOW=${low}`)
          JS
          exit 0
      - name: Show changed files
        run: |
          git diff --check
          git diff --stat
          git diff --name-only
