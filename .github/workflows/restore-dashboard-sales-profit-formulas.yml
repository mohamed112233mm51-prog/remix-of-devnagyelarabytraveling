name: Restore dashboard sales and profit formulas

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/restore-dashboard-sales-profit-formulas.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Restore original dashboard formulas only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # 1) Main KPI "إجمالي مبيعات الوكلاء": restore executed-services source.
          p = Path('src/components/DashboardAccountPeriodEnhancer.tsx')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              'import { useExpensePeriodTotals } from "@/hooks/useExpensePeriodTotals";\n',
              'import { useExpensePeriodTotals } from "@/hooks/useExpensePeriodTotals";\nimport { useExecutionAgentSalesPeriod } from "@/hooks/useExecutionAgentSalesPeriod";\n',
              'dashboard account import',
          )
          s = once(
              s,
              '  const expenseTotals = useExpensePeriodTotals(period);\n  const agentAccountTotals = useAgentAccountTotals();',
              '  const expenseTotals = useExpensePeriodTotals(period);\n  const executionAgentSales = useExecutionAgentSalesPeriod(period);\n  const agentAccountTotals = useAgentAccountTotals();',
              'dashboard sales hook',
          )
          s = once(
              s,
              '''      {slots.agentSales && createPortal(\n        <DashboardHeroCard\n          label={isLifetime ? "إجمالي مبيعات الوكلاء" : `خدمات الوكلاء — ${periodLabel}`}\n          value={<CurrencyLines map={agentTotals.debit} />}\n          icon={<Users size={18} />}\n          tone="success"\n          sub={isLifetime ? "إجمالي دفتر حسابات الوكلاء" : "حركة الفترة المختارة"}\n        />,\n        slots.agentSales,\n      )}''',
              '''      {slots.agentSales && createPortal(\n        <DashboardHeroCard\n          label={isLifetime ? "إجمالي مبيعات الوكلاء" : `مبيعات الوكلاء — ${periodLabel}`}\n          value={<CurrencyLines map={executionAgentSales} />}\n          icon={<Users size={18} />}\n          tone="success"\n          sub="من خدمات التنفيذات المنفذة فقط"\n        />,\n        slots.agentSales,\n      )}''',
              'dashboard agent sales card',
          )
          p.write_text(s, encoding='utf-8')

          # 2) Profit period semantics: restore old dashboard date basis (created_at),
          # while computeExecutionProfitEGP continues to include operation_status=منفذ only.
          p = Path('src/lib/dashboardPeriodProfit.functions.ts')
          s = p.read_text(encoding='utf-8')
          s = once(
              s,
              ' * التنفيذات تستخدم financial_posting_date ثم created_at.\n * المصروفات تستخدم date ثم created_at.',
              ' * التنفيذات تستخدم created_at كما كان الداشبورد قبل تعديل الفلاتر.\n * المصروفات تستخدم created_at كما كان الداشبورد قبل تعديل الفلاتر.',
              'profit comment',
          )
          s = once(
              s,
              '      const accountingDate = execution.financial_posting_date || execution.created_at || null;',
              '      const accountingDate = execution.created_at || null;',
              'execution profit period date',
          )
          s = once(
              s,
              '      const accountingDate = expense.date || expense.created_at || null;',
              '      const accountingDate = expense.created_at || null;',
              'expense profit period date',
          )
          p.write_text(s, encoding='utf-8')

          # 3) Dedicated live hook for the original sales formula, period-aware.
          hook = Path('src/hooks/useExecutionAgentSalesPeriod.ts')
          if hook.exists():
              raise SystemExit('useExecutionAgentSalesPeriod.ts already exists; refusing to overwrite')
          hook.write_text('''import { useMemo } from "react";\nimport { cairoToday } from "@/lib/approvalFines";\nimport { useLive } from "@/lib/db";\nimport { computeExecutionAgentSalesByCurrency } from "@/lib/dashboardCollections";\nimport type { ExecutionRow } from "@/lib/executionProfit";\nimport { isDateInSummaryPeriod, type SummaryPeriod } from "@/lib/summaryPeriod";\nimport type { CurrencyMap } from "@/lib/financialSummary";\n\ntype DashboardExecutionRow = ExecutionRow & {\n  cancelled_at?: string | null;\n};\n\n/**\n * نفس معادلة «إجمالي مبيعات الوكلاء» الأصلية في الداشبورد:\n * مجموع agent_price × count من services الخاصة بالتنفيذات بحالة «منفذ» فقط،\n * مع إبقاء كل عملة منفصلة. الإضافة الوحيدة هي تطبيق فلتر الفترة الحالي.\n */\nexport function useExecutionAgentSalesPeriod(period: SummaryPeriod): CurrencyMap {\n  const { rows: executions } = useLive<DashboardExecutionRow>("executions");\n  const todayISO = cairoToday();\n\n  return useMemo(() => {\n    const executedInPeriod = executions.filter((execution) =>\n      String(execution.operation_status || "").trim() === "منفذ"\n      && !execution.cancelled_at\n      && isDateInSummaryPeriod(execution.created_at || null, period, todayISO),\n    );\n    return computeExecutionAgentSalesByCurrency(executedInPeriod);\n  }, [executions, period, todayISO]);\n}\n''', encoding='utf-8')
          PY

      - name: Verify only requested files changed
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'src/components/DashboardAccountPeriodEnhancer.tsx' \
            'src/hooks/useExecutionAgentSalesPeriod.ts' \
            'src/lib/dashboardPeriodProfit.functions.ts' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check

      - name: Commit scoped changes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/restore-dashboard-sales-profit-formulas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/DashboardAccountPeriodEnhancer.tsx src/hooks/useExecutionAgentSalesPeriod.ts src/lib/dashboardPeriodProfit.functions.ts .github/workflows/restore-dashboard-sales-profit-formulas.yml
          git diff --cached --check
          git commit -m "fix(dashboard): restore executed-profit and agent-sales formulas"
          git push origin devo
