name: Patch dashboard financial permissions

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/patch-dashboard-financial-permissions.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped permission patch
        run: python3 scripts/_patch_dashboard_financial_permissions.py

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'src/components/FinancialPositionPanel.tsx' \
            'src/hooks/usePerm.tsx' \
            'src/lib/permissionKeys.ts' \
            'src/routes/settings.tsx' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected changed files:'
            printf '%s\n' "$changed"
            exit 1
          fi
          grep -q 'FINANCIAL_POSITION_PERMISSION_KEY = "financial_position_view"' src/lib/permissionKeys.ts
          grep -q 'المركز المالي الحالي — الداشبورد' src/routes/settings.tsx
          grep -q '{ key: "investors"' src/routes/settings.tsx
          grep -q 'variant === "dashboard" ? FINANCIAL_POSITION_PERMISSION_KEY : "investors"' src/components/FinancialPositionPanel.tsx

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
        run: bun run build

      - name: Commit scoped feature
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/routeTree.gen.ts || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/FinancialPositionPanel.tsx src/hooks/usePerm.tsx src/lib/permissionKeys.ts src/routes/settings.tsx
          git rm .github/workflows/patch-dashboard-financial-permissions.yml scripts/_patch_dashboard_financial_permissions.py
          git diff --cached --check
          git commit -m 'feat(permissions): separate owner and financial-position access'
          git push origin devo
