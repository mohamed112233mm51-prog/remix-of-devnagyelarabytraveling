name: Apply monthly carry-forward to merchant and supplier statements

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/apply-monthly-carry-merchant-supplier.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Patch statements only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------
          # Cash merchant statement
          # ------------------------------------------------------------
          p = Path('src/features/merchants/LegacyMerchantsRoute.tsx')
          s = p.read_text(encoding='utf-8')

          s = once(s,
              'import CurrencyFilter from "@/components/CurrencyFilter";\n',
              'import CurrencyFilter from "@/components/CurrencyFilter";\nimport { cairoToday } from "@/lib/approvalFines";\nimport { currentMonthKey, monthPeriodFor } from "@/lib/monthlyLedger";\nimport { MonthPeriodPicker, buildMonthOptions, monthLabel } from "@/components/MonthPeriodPicker";\n',
              'merchant imports')

          s = once(s,
              '  sourceTable: CancellableTable;\n  sourceId: string;\n};',
              '  sourceTable: CancellableTable;\n  sourceId: string;\n  isOpeningCarryForward?: boolean;\n};',
              'merchant movement opening flag')

          s = once(s,
              '  const [merchantId, setMerchantId] = useState<string>(merchants[0]?.id || "");\n  const [from, setFrom] = useState("");\n  const [to, setTo] = useState("");\n  const [typeFilter, setTypeFilter] = useState<"all" | "incoming" | "outgoing" | "collection" | "cashout" | "conversion">("all");',
              '  const [merchantId, setMerchantId] = useState<string>(merchants[0]?.id || "");\n  const today = cairoToday();\n  const [monthKey, setMonthKey] = useState<string>(() => currentMonthKey(today));\n  const [typeFilter, setTypeFilter] = useState<"all" | "incoming" | "outgoing" | "collection" | "cashout" | "conversion">("all");',
              'merchant month state')

          old = '''  }, [merchantId, incomingTxns, outgoingTxns, cashMoveTxns, collections, conversions, splits]);\n\n  const debouncedSearch = useDebouncedValue(search, 250);\n  const filtered = useMemo(() => movements.filter((m) => {\n    if (from && m.date < from) return false;\n    if (to && m.date > to) return false;\n    if (typeFilter === "incoming" && m.type !== "وارد من وكيل") return false;\n    if (typeFilter === "outgoing" && m.type !== "صادر لشركة") return false;\n    if (typeFilter === "collection" && m.type !== "تحصيل نقدية من التاجر") return false;\n    if (typeFilter === "cashout" && m.type !== "صرف نقدية للتاجر") return false;\n    if (typeFilter === "conversion" && m.type !== "تحويل لـ USD") return false;\n    if (currencyFilter && (m.currency || "EGP") !== currencyFilter) return false;\n    if (debouncedSearch && !`${m.type} ${m.statement}`.toLowerCase().includes(debouncedSearch.toLowerCase())) return false;\n    return true;\n  }), [movements, from, to, typeFilter, currencyFilter, debouncedSearch]);'''
          new = '''  }, [merchantId, incomingTxns, outgoingTxns, cashMoveTxns, collections, conversions, splits]);\n\n  const monthOptions = useMemo(\n    () => buildMonthOptions(movements.map((m) => m.date), today),\n    [movements, today],\n  );\n  const period = useMemo(() => monthPeriodFor(monthKey, today), [monthKey, today]);\n\n  // نفس منطق الوكيل/الشركة: رصيد ما قبل بداية الشهر يظهر كسطر افتراضي فقط.\n  // لا يتم إنشاء أو تعديل أي حركة في قاعدة البيانات.\n  const monthlyMovements = useMemo<StatementMovement[]>(() => {\n    const opening = new Map<string, number>();\n    const monthRows: StatementMovement[] = [];\n    for (const m of movements) {\n      const cur = m.currency || "EGP";\n      const d = String(m.date || "").slice(0, 10);\n      if (!d || d < period.start) {\n        opening.set(cur, (opening.get(cur) || 0) + Number(m.delta || 0));\n        continue;\n      }\n      if (d >= period.endExclusive) continue;\n      monthRows.push(m);\n    }\n    const openingRows: StatementMovement[] = Array.from(opening.entries())\n      .filter(([, net]) => Math.abs(net) > 0.0000001)\n      .sort(([a], [b]) => a.localeCompare(b))\n      .map(([currency, net]) => ({\n        id: `opening:${merchantId || "merchant"}:${period.monthKey}:${currency}`,\n        date: period.start,\n        createdAt: "",\n        type: "رصيد سابق",\n        statement: "رصيد سابق",\n        gross: Math.abs(net),\n        commission: 0,\n        net: Math.abs(net),\n        delta: net,\n        currency,\n        sourceTable: "transactions" as CancellableTable,\n        sourceId: "",\n        isOpeningCarryForward: true,\n      }));\n    return [...openingRows, ...monthRows];\n  }, [movements, period, merchantId]);\n\n  const debouncedSearch = useDebouncedValue(search, 250);\n  const filtered = useMemo(() => monthlyMovements.filter((m) => {\n    const opening = Boolean(m.isOpeningCarryForward);\n    if (!opening && typeFilter === "incoming" && m.type !== "وارد من وكيل") return false;\n    if (!opening && typeFilter === "outgoing" && m.type !== "صادر لشركة") return false;\n    if (!opening && typeFilter === "collection" && m.type !== "تحصيل نقدية من التاجر") return false;\n    if (!opening && typeFilter === "cashout" && m.type !== "صرف نقدية للتاجر") return false;\n    if (!opening && typeFilter === "conversion" && m.type !== "تحويل لـ USD") return false;\n    if (currencyFilter && (m.currency || "EGP") !== currencyFilter) return false;\n    if (!opening && debouncedSearch && !`${m.type} ${m.statement}`.toLowerCase().includes(debouncedSearch.toLowerCase())) return false;\n    return true;\n  }), [monthlyMovements, typeFilter, currencyFilter, debouncedSearch]);'''
          s = once(s, old, new, 'merchant monthly carry block')

          s = once(s,
              '    title: `كشف حساب تاجر الكاش${merchant?.merchant_name ? ` — ${merchant.merchant_name}` : ""}${currencyFilter ? ` (${currencyFilter})` : ""}`,\n    subtitle: `${merchant?.merchant_name || ""}${from || to ? ` — من ${from || "..."} إلى ${to || "..."}` : ""}`,',
              '    title: `كشف حساب تاجر الكاش${merchant?.merchant_name ? ` — ${merchant.merchant_name}` : ""} — ${monthLabel(period.monthKey)}${currencyFilter ? ` (${currencyFilter})` : ""}`,\n    subtitle: `${merchant?.merchant_name || ""} — من ${period.start} إلى ${period.endInclusive}`,',
              'merchant export period')

          s = once(s,
              '            <div className="form-group"><label><Calendar size={12} /> من تاريخ</label><DateInput value={from} onChange={setFrom} /></div>\n            <div className="form-group"><label><Calendar size={12} /> إلى تاريخ</label><DateInput value={to} onChange={setTo} /></div>',
              '            <MonthPeriodPicker monthKey={monthKey} onChange={setMonthKey} options={monthOptions} period={period} today={today} />',
              'merchant month picker')

          s = once(s,
              '                ) : pageMovements.map((m, i) => {\n                  const idx = page * pageSize + i;\n                  const color = m.type === "وارد من وكيل" ? "#15803D" : "#B91C1C";\n                  return (\n                    <tr key={m.id}>',
              '                ) : pageMovements.map((m, i) => {\n                  const idx = page * pageSize + i;\n                  const opening = Boolean(m.isOpeningCarryForward);\n                  const color = m.type === "وارد من وكيل" ? "#15803D" : "#B91C1C";\n                  return (\n                    <tr key={m.id} style={opening ? { background: "rgba(30,58,138,0.06)", fontWeight: 700 } : undefined}>',
              'merchant opening row style')

          s = once(s,
              '''                      {isVisible("actions") && (\n                        <td data-label="إجراءات">\n                          <EditTransactionButton table={m.sourceTable} id={m.sourceId} cancelled={false} />\n                          <CancelTransactionButton table={m.sourceTable} id={m.sourceId} cancelled={false} />\n                        </td>\n                      )}''',
              '''                      {isVisible("actions") && (\n                        <td data-label="إجراءات">\n                          {!opening && <>\n                            <EditTransactionButton table={m.sourceTable} id={m.sourceId} cancelled={false} />\n                            <CancelTransactionButton table={m.sourceTable} id={m.sourceId} cancelled={false} />\n                          </>}\n                        </td>\n                      )}''',
              'merchant opening actions')

          p.write_text(s, encoding='utf-8')

          # ------------------------------------------------------------
          # Currency supplier statement
          # ------------------------------------------------------------
          p = Path('src/features/currency-suppliers/LegacyCurrencySupplierStatementRoute.tsx')
          s = p.read_text(encoding='utf-8')

          s = once(s,
              'import CurrencyFilter from "@/components/CurrencyFilter";\n',
              'import CurrencyFilter from "@/components/CurrencyFilter";\nimport { cairoToday } from "@/lib/approvalFines";\nimport { currentMonthKey, monthPeriodFor } from "@/lib/monthlyLedger";\nimport { MonthPeriodPicker, buildMonthOptions, monthLabel } from "@/components/MonthPeriodPicker";\n',
              'supplier imports')

          s = once(s,
              '  buildCurrencySupplierLedgerRows,\n} from "@/lib/financialSummary";',
              '  buildCurrencySupplierLedgerRows,\n  currencySupplierDelta,\n} from "@/lib/financialSummary";',
              'supplier delta import')

          s = once(s,
              '  opening_currency?: string | null;\n  created_at: string;\n};',
              '  opening_currency?: string | null;\n  created_at: string;\n  isOpeningCarryForward?: boolean;\n};',
              'supplier opening flag')

          s = once(s,
              '  // Filters\n  const [from, setFrom] = useState("");\n  const [to, setTo] = useState("");\n  const [typeFilter, setTypeFilter] = useState<string>("");',
              '  // Filters\n  const today = cairoToday();\n  const [monthKey, setMonthKey] = useState<string>(() => currentMonthKey(today));\n  const [typeFilter, setTypeFilter] = useState<string>("");',
              'supplier month state')

          old = '''  const filtered = useMemo(() => {\n    // Normalize legacy Arabic currency values to canonical codes so old rows\n    // group correctly with new ones.\n    const normalized = txns.map((t) => ({\n      ...t,\n      bought_currency: normalizeCurrency(t.bought_currency),\n      sold_currency: normalizeCurrency(t.sold_currency),\n    }));\n    // Single Source of Truth: استبعاد الحركات الملغاة + الترتيب الحتمي\n    // (tx_date ASC → created_at ASC → id ASC) يتم داخل المحرك الموحد،\n    // بحيث يعتمد العرض والرصيد الجاري على تاريخ الحركة الذي أدخله المستخدم.\n    const canonical = buildCurrencySupplierLedgerRows(normalized);\n    return canonical.filter((t) => {\n      if (from && t.tx_date < from) return false;\n      if (to && t.tx_date > to) return false;\n      if (typeFilter && t.tx_type !== typeFilter) return false;\n      if (currencyFilter && t.bought_currency !== currencyFilter && t.sold_currency !== currencyFilter) return false;\n      return true;\n    });\n  }, [txns, from, to, typeFilter, currencyFilter]);'''
          new = '''  const canonicalRows = useMemo(() => {\n    // Normalize legacy Arabic currency values to canonical codes so old rows\n    // group correctly with new ones.\n    const normalized = txns.map((t) => ({\n      ...t,\n      bought_currency: normalizeCurrency(t.bought_currency),\n      sold_currency: normalizeCurrency(t.sold_currency),\n    }));\n    // Single Source of Truth: استبعاد الحركات الملغاة + الترتيب الحتمي.\n    return buildCurrencySupplierLedgerRows(normalized);\n  }, [txns]);\n\n  const monthOptions = useMemo(\n    () => buildMonthOptions(canonicalRows.map((t) => t.tx_date), today),\n    [canonicalRows, today],\n  );\n  const period = useMemo(() => monthPeriodFor(monthKey, today), [monthKey, today]);\n\n  // نفس منطق الوكيل/الشركة: نحسب صافي كل ما قبل بداية الشهر لكل عملة\n  // ونضيفه كسطر «رصيد سابق» افتراضي بدون أي INSERT في قاعدة البيانات.\n  const periodRows = useMemo<Tx[]>(() => {\n    const opening = new Map<string, number>();\n    const monthRows: Tx[] = [];\n    for (const t of canonicalRows) {\n      const d = String(t.tx_date || "").slice(0, 10);\n      const { currency, delta } = currencySupplierDelta(t);\n      if (!d || d < period.start) {\n        opening.set(currency, (opening.get(currency) || 0) + delta);\n        continue;\n      }\n      if (d >= period.endExclusive) continue;\n      monthRows.push(t);\n    }\n    const openingRows: Tx[] = Array.from(opening.entries())\n      .filter(([, net]) => Math.abs(net) > 0.0000001)\n      .sort(([a], [b]) => a.localeCompare(b))\n      .map(([currency, net]) => ({\n        id: `opening:${supplierId}:${period.monthKey}:${currency}`,\n        supplier_id: supplierId,\n        tx_date: period.start,\n        tx_type: "رصيد سابق",\n        bought_currency: currency,\n        bought_amount: net > 0 ? net : 0,\n        sold_currency: currency,\n        sold_amount: net < 0 ? Math.abs(net) : 0,\n        exchange_rate: null,\n        description: "رصيد سابق",\n        payment_splits: null,\n        opening_currency: currency,\n        created_at: "",\n        isOpeningCarryForward: true,\n      }));\n    return [...openingRows, ...monthRows];\n  }, [canonicalRows, period, supplierId]);\n\n  const filtered = useMemo(() => periodRows.filter((t) => {\n    const opening = Boolean(t.isOpeningCarryForward);\n    if (!opening && typeFilter && t.tx_type !== typeFilter) return false;\n    if (currencyFilter && t.bought_currency !== currencyFilter && t.sold_currency !== currencyFilter && t.opening_currency !== currencyFilter) return false;\n    return true;\n  }), [periodRows, typeFilter, currencyFilter]);'''
          s = once(s, old, new, 'supplier monthly carry block')

          s = once(s,
              '    title: `كشف حساب مورد العملة${supplier?.name ? ` — ${supplier.name}` : ""}${currencyFilter ? ` (${arabicCurrencyName(currencyFilter)})` : ""}`,\n    subtitle: currencyFilter ? `العملة: ${arabicCurrencyName(currencyFilter)}` : undefined,',
              '    title: `كشف حساب مورد العملة${supplier?.name ? ` — ${supplier.name}` : ""} — ${monthLabel(period.monthKey)}${currencyFilter ? ` (${arabicCurrencyName(currencyFilter)})` : ""}`,\n    subtitle: `${monthLabel(period.monthKey)} — من ${period.start} إلى ${period.endInclusive}${currencyFilter ? ` — العملة: ${arabicCurrencyName(currencyFilter)}` : ""}`,',
              'supplier export period')

          s = once(s,
              '''        <div className="form-group" style={{ minWidth: 140 }}>\n          <label>من تاريخ</label>\n          <input type="date" value={from} onChange={(e) => setFrom(e.target.value)} />\n        </div>\n        <div className="form-group" style={{ minWidth: 140 }}>\n          <label>إلى تاريخ</label>\n          <input type="date" value={to} onChange={(e) => setTo(e.target.value)} />\n        </div>''',
              '        <MonthPeriodPicker monthKey={monthKey} onChange={setMonthKey} options={monthOptions} period={period} today={today} />',
              'supplier month picker')

          s = once(s,
              '        {(from || to || typeFilter || currencyFilter) && (\n          <button className="action-btn" style={{ alignSelf: "end" }} onClick={() => { setFrom(""); setTo(""); setTypeFilter(""); setCurrencyFilter(""); }}>',
              '        {(typeFilter || currencyFilter) && (\n          <button className="action-btn" style={{ alignSelf: "end" }} onClick={() => { setTypeFilter(""); setCurrencyFilter(""); }}>',
              'supplier clear filters')

          s = once(s,
              '''                          <EditTransactionButton table="currency_supplier_transactions" id={r.id} cancelled={false} onDone={refresh} />\n                          <CancelTransactionButton table="currency_supplier_transactions" id={r.id} cancelled={false} onDone={refresh} />''',
              '''                          {!r.isOpeningCarryForward && <>\n                            <EditTransactionButton table="currency_supplier_transactions" id={r.id} cancelled={false} onDone={refresh} />\n                            <CancelTransactionButton table="currency_supplier_transactions" id={r.id} cancelled={false} onDone={refresh} />\n                          </>}''',
              'supplier opening actions')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-monthly-carry-merchant-supplier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/merchants/LegacyMerchantsRoute.tsx src/features/currency-suppliers/LegacyCurrencySupplierStatementRoute.tsx .github/workflows/apply-monthly-carry-merchant-supplier.yml
          git diff --cached --check
          git commit -m "feat(statements): add monthly carry-forward for merchants and currency suppliers [skip ci]"
          git push origin devo
