name: Verify financial atomicity

on:
  push:
    branches: [devo]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit atomic financial write paths
        run: python3 scripts/_audit_financial_atomic.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Trip reconciliation tests
        run: npm run test:trip-reconciliation
      - name: Direct transfer regression
        run: npm run test:agent-company-direct
      - name: Production build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
