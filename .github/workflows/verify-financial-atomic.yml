name: Verify financial atomicity

on:
  push:
    branches: [devo]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit atomic financial write paths
        run: python3 scripts/_audit_financial_atomic.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test paid expense and currency edit consistency
        run: npm run test:financial-edit
      - name: Test execution saves and linked debts in one transaction
        run: npm run test:execution-save
      - name: Test trip reconciliation
        run: npm run test:trip-reconciliation
      - name: Production build
        run: npm run build
