name: Temporary role admin authorization audit

on:
  push:
    branches:
      - tmp-permissions-hardening-ci
  pull_request:
    branches:
      - permissions-hardening

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-permissions-hardening-ci
          fetch-depth: 0
      - name: Find production wipe authorization and remaining role-admin checks
        shell: bash
        run: |
          set -euo pipefail
          echo '=== production reset RPC ==='
          grep -RIn -A45 -B15 'reset_production_business_data' supabase/migrations || true
          echo '=== remaining role-admin authorization ==='
          grep -RInE --include='*.ts' --include='*.tsx' '\.eq\("role", *"admin"\)|rpc\("has_role"|has_role[^\n]*admin' src/lib src/routes/api || true
