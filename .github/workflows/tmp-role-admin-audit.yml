name: Temporary role admin authorization audit

on:
  push:
    branches:
      - tmp-permissions-hardening-ci
  pull_request:
    branches:
      - permissions-hardening

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-permissions-hardening-ci
          fetch-depth: 0
      - name: Find legacy role-admin authorization in application server code
        shell: bash
        run: |
          set -euo pipefail
          echo '=== ensureAdmin / role-admin checks ==='
          grep -RInE --include='*.ts' --include='*.tsx' 'ensureAdmin|has_role|\.eq\("role", *"admin"\)|role[^\n]*admin|isAdmin' src/lib src/routes/api || true
          echo '=== Service role server functions ==='
          grep -RInE --include='*.ts' --include='*.tsx' 'SUPABASE_SERVICE_ROLE_KEY|supabaseAdmin|createClient<Database>' src/lib src/routes/api || true
