name: Apply accounts complete summary patch

on:
  push:
    branches: [devo]
    paths:
      - 'scripts/_patch_accounts_complete_summary.py'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped patch
        run: python3 scripts/_patch_accounts_complete_summary.py

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'useCompleteAgentsSummary' src/features/accounts/LegacyAccountsRoute.tsx
          grep -q 'useCompleteAgentsSummary' src/hooks/useAgentAccountTotals.ts
          grep -q 'range(from, from + PAGE_SIZE - 1)' src/hooks/useCompleteAgentsSummary.ts

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
        run: bun run build

      - name: Commit feature and cleanup helpers
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/routeTree.gen.ts || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/accounts/LegacyAccountsRoute.tsx src/hooks/useCompleteAgentsSummary.ts src/hooks/useAgentAccountTotals.ts
          git rm scripts/_patch_accounts_complete_summary.py .github/workflows/apply-accounts-complete-summary.yml
          git diff --cached --check
          git commit -m 'fix(accounts): keep agent list aligned with complete ledgers'
          git push origin devo
