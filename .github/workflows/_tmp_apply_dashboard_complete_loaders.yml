name: Temporary dashboard complete-loader patch

on:
  push:
    branches: [accounting-scalability-integration]
    paths:
      - scripts/_tmp_patch_dashboard_complete_loaders.py
      - .github/workflows/_tmp_apply_dashboard_complete_loaders.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: accounting-scalability-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused patch
        run: python3 scripts/_tmp_patch_dashboard_complete_loaders.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Commit production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          if git diff --cached --quiet; then
            echo "No production changes to commit"
          else
            git commit -m "fix dashboard: load complete large-table history"
            git push origin accounting-scalability-integration
          fi
