name: Security phase 3 validate

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-phase3-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null
      - name: Create minimal auth schema
        env:
          PGPASSWORD: postgres
        run: |
          cat > /tmp/prelude.sql <<'SQL'
          CREATE SCHEMA auth;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TYPE public.app_role AS ENUM ('admin','manager','user');
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated, service_role;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated, service_role;
          CREATE TABLE public.profiles (
            id uuid PRIMARY KEY,
            is_active boolean NOT NULL DEFAULT true,
            invite_accepted boolean NOT NULL DEFAULT true,
            is_super_admin boolean NOT NULL DEFAULT false,
            permissions jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE TABLE public.user_roles (user_id uuid NOT NULL, role public.app_role NOT NULL);
          ALTER TABLE public.profiles ENABLE ROW LEVEL SECURITY;
          ALTER TABLE public.user_roles ENABLE ROW LEVEL SECURITY;
          CREATE POLICY profiles_self_select ON public.profiles FOR SELECT TO authenticated USING (auth.uid()=id);
          CREATE POLICY old_user_roles_read ON public.user_roles FOR SELECT TO authenticated USING (true);
          CREATE POLICY old_user_roles_write ON public.user_roles FOR ALL TO authenticated USING (true) WITH CHECK (true);
          GRANT SELECT ON public.profiles TO authenticated;
          GRANT SELECT,INSERT,UPDATE,DELETE ON public.user_roles TO authenticated;
          GRANT SELECT,INSERT,UPDATE,DELETE ON public.user_roles TO service_role;
          CREATE OR REPLACE FUNCTION public.has_role(_user_id uuid,_role public.app_role)
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path=public AS $$
            SELECT EXISTS(SELECT 1 FROM public.user_roles WHERE user_id=_user_id AND role=_role)
          $$;
          CREATE OR REPLACE FUNCTION public.can_view_audit_log(_uid uuid)
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path=public AS $$ SELECT true $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d security_test -v ON_ERROR_STOP=1 -f /tmp/prelude.sql
      - name: Apply phase 3 migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d security_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260810203000_security_definer_client_hardening.sql
      - name: Verify invoker functions and self-only role read
        env:
          PGPASSWORD: postgres
        run: |
          cat > /tmp/assert.sql <<'SQL'
          INSERT INTO public.profiles(id,permissions) VALUES
            ('11111111-1111-4111-8111-111111111111','{"audit_log_view":true}'),
            ('22222222-2222-4222-8222-222222222222','{}');
          INSERT INTO public.user_roles(user_id,role) VALUES
            ('11111111-1111-4111-8111-111111111111','user'),
            ('22222222-2222-4222-8222-222222222222','admin');
          DO $$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM pg_proc
            WHERE proname IN ('has_role','can_view_audit_log') AND prosecdef=true;
            IF n <> 0 THEN RAISE EXCEPTION 'client-callable SECURITY DEFINER remains'; END IF;
            SELECT count(*) INTO n FROM pg_policies WHERE schemaname='public' AND tablename='user_roles';
            IF n <> 1 THEN RAISE EXCEPTION 'unexpected user_roles policy count: %', n; END IF;
          END $$;
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',false);
          DO $$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM public.user_roles;
            IF n <> 1 THEN RAISE EXCEPTION 'caller can see another user role'; END IF;
            IF NOT public.has_role('11111111-1111-4111-8111-111111111111','user') THEN RAISE EXCEPTION 'own role lookup failed'; END IF;
            IF public.has_role('22222222-2222-4222-8222-222222222222','admin') THEN RAISE EXCEPTION 'other user role leaked'; END IF;
            IF NOT public.can_view_audit_log('11111111-1111-4111-8111-111111111111') THEN RAISE EXCEPTION 'own audit permission failed'; END IF;
            IF public.can_view_audit_log('22222222-2222-4222-8222-222222222222') THEN RAISE EXCEPTION 'other user audit permission leaked'; END IF;
          END $$;
          RESET ROLE;
          SQL
          psql -h 127.0.0.1 -U postgres -d security_test -v ON_ERROR_STOP=1 -f /tmp/assert.sql
      - name: Verify direct role mutation is blocked
        env:
          PGPASSWORD: postgres
        run: |
          if psql -h 127.0.0.1 -U postgres -d security_test -v ON_ERROR_STOP=1 <<'SQL'
          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',false);
          INSERT INTO public.user_roles(user_id,role) VALUES ('11111111-1111-4111-8111-111111111111','admin');
          SQL
          then
            echo 'ERROR: authenticated role mutation unexpectedly succeeded'
            exit 1
          else
            echo 'Authenticated direct role mutation correctly blocked by RLS'
          fi
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
