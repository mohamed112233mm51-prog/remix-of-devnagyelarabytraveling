name: Security audit details

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-audit-details.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
      - uses: oven-sh/setup-bun@v2
      - name: Prepare previously validated candidate locally
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json'); d=json.loads(p.read_text())
          d['dependencies']['xlsx']='https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
          d['dependencies']['@cloudflare/vite-plugin']='^1.51.2'
          d['dependencies']['@supabase/supabase-js']='^2.112.2'
          d['dependencies']['nitro']='3.0.260610-beta'
          d['devDependencies']['@lovable.dev/vite-tanstack-config']='2.10.0'
          d['devDependencies']['vite']='^7.3.6'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf node_modules
          bun install
      - name: Print remaining audit records compactly
        run: |
          set +e
          bun audit --json > /tmp/audit.json 2>/tmp/audit.err
          node - <<'JS'
          const fs=require('fs'); let d={};
          try{ d=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8')); }catch(e){ console.error(e); process.exit(0); }
          for(const [pkg,items] of Object.entries(d)){
            console.log(`\n===== ${pkg} =====`)
            for(const x of items){
              console.log(JSON.stringify({
                id:x.id, severity:x.severity, title:x.title,
                vulnerable_versions:x.vulnerable_versions,
                patched_versions:x.patched_versions,
                more_info:x.more_info,
                url:x.url,
              }))
            }
          }
          JS
          cat /tmp/audit.err || true
          exit 0
      - name: Print installed versions and dependency parents
        run: |
          for pkg in @babel/core brace-expansion dompurify esbuild js-yaml nanoid postcss tmp uuid ws; do
            echo "===== WHY $pkg ====="
            bun pm why "$pkg" || true
          done
