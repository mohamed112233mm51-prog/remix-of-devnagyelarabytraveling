name: Security dependency hardening trial v2

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-dependency-trial-v2.yml'

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
      - uses: oven-sh/setup-bun@v2
      - name: Install current lock
        run: bun install --frozen-lockfile

      - name: Replace SheetJS parser with existing ExcelJS locally
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/dataImport/parse.ts')
          t=p.read_text(encoding='utf-8')
          t=t.replace('import * as XLSX from "xlsx";','import ExcelJS from "exceljs";')
          old='''async function parseXLSX(file: File): Promise<ParsedFile> {\n  const buf = await file.arrayBuffer();\n  const wb = XLSX.read(buf, { type: "array", cellDates: true });\n  const sheet = wb.Sheets[wb.SheetNames[0]];\n  const rows = XLSX.utils.sheet_to_json<Record<string, any>>(sheet, { defval: "", raw: false });\n  const headers = rows.length ? Object.keys(rows[0]) : [];\n  return { headers, rows };\n}\n'''
          new='''async function parseXLSX(file: File): Promise<ParsedFile> {\n  const buf = await file.arrayBuffer();\n  const workbook = new ExcelJS.Workbook();\n  await workbook.xlsx.load(buf);\n  const sheet = workbook.worksheets[0];\n  if (!sheet || sheet.rowCount === 0) return { headers: [], rows: [] };\n\n  const headerRow = sheet.getRow(1);\n  const headers: string[] = [];\n  const used = new Map<string, number>();\n  for (let col = 1; col <= sheet.columnCount; col++) {\n    const base = headerRow.getCell(col).text.trim();\n    if (!base) { headers.push(\"\"); continue; }\n    const seen = used.get(base) || 0;\n    used.set(base, seen + 1);\n    headers.push(seen === 0 ? base : `${base}_${seen}`);\n  }\n\n  const rows: Record<string, any>[] = [];\n  for (let rowNumber = 2; rowNumber <= sheet.rowCount; rowNumber++) {\n    const row = sheet.getRow(rowNumber);\n    const record: Record<string, any> = {};\n    let hasValue = false;\n    for (let col = 1; col <= headers.length; col++) {\n      const header = headers[col - 1];\n      if (!header) continue;\n      const value = row.getCell(col).text;\n      record[header] = value;\n      if (value !== \"\") hasValue = true;\n    }\n    if (hasValue) rows.push(record);\n  }\n  return { headers: headers.filter(Boolean), rows };\n}\n'''
          assert old in t
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          d=json.loads(p.read_text())
          d['dependencies'].pop('xlsx',None)
          # Stay within current major lines where possible; update only parents
          # implicated by the audit, not unrelated UI libraries.
          d['dependencies']['@cloudflare/vite-plugin']='^1.51.2'
          d['dependencies']['@supabase/supabase-js']='^2.112.2'
          d['dependencies']['nitro']='3.0.260610-beta'
          d['devDependencies']['@lovable.dev/vite-tanstack-config']='2.10.0'
          d['devDependencies']['vite']='^7.3.6'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf node_modules
          bun install

      - name: XLSX import parser smoke test
        run: |
          bun --eval '
            import ExcelJS from "exceljs";
            import { parseFile } from "./src/lib/dataImport/parse.ts";
            const wb = new ExcelJS.Workbook();
            const ws = wb.addWorksheet("Data");
            ws.addRow(["الاسم", "المبلغ", "التاريخ"]);
            ws.addRow(["أحمد", 1250, new Date("2026-08-10T00:00:00Z")]);
            ws.getCell("C2").numFmt = "yyyy-mm-dd";
            ws.addRow(["سارة", 0, ""]);
            const b = await wb.xlsx.writeBuffer();
            const f = new File([b], "sample.xlsx", {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
            const out = await parseFile(f);
            console.log(JSON.stringify(out));
            if (out.headers.join("|") !== "الاسم|المبلغ|التاريخ") throw new Error("headers mismatch");
            if (out.rows.length !== 2) throw new Error("row count mismatch");
            if (out.rows[0]["الاسم"] !== "أحمد" || out.rows[0]["المبلغ"] !== "1250") throw new Error("values mismatch");
          '

      - name: Build candidate
        run: bun run build

      - name: Audit candidate
        run: |
          set +e
          bun audit --json > /tmp/audit.json 2>/tmp/audit.err
          code=$?
          echo "bun audit exit=$code"
          cat /tmp/audit.err || true
          node - <<'JS'
          const fs=require('fs');
          let d={}; try{d=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'))}catch{}
          let total=0, high=0, moderate=0, low=0;
          for(const [pkg,items] of Object.entries(d)){
            total += items.length;
            for(const x of items){ if(x.severity==='high') high++; else if(x.severity==='moderate') moderate++; else low++; }
            console.log(`${pkg}: ${items.length} -> ${[...new Set(items.map(x=>x.severity))].join(', ')}`)
          }
          console.log(`TOTAL=${total} HIGH=${high} MODERATE=${moderate} LOW=${low}`)
          JS
          exit 0

      - name: Show candidate diff only
        run: |
          git diff --check
          git diff --stat
          git diff -- package.json src/lib/dataImport/parse.ts | head -300
