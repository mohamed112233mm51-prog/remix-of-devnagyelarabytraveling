name: Apply complete merchant data fix

on:
  push:
    branches: [devo]
    paths:
      - scripts/_patch_complete_merchant_data.py
      - .github/workflows/apply-complete-merchant-data.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python3 scripts/_patch_complete_merchant_data.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useCompleteMerchantFinancialData.ts src/lib/financialSummary.ts src/features/merchants/LegacyMerchantsRoute.tsx src/hooks/useMerchantPeriodTotals.ts
          if git diff --cached --quiet; then
            echo "No application changes to commit"
          else
            git commit -m "fix merchants: load complete financial history"
            git push origin devo
          fi
