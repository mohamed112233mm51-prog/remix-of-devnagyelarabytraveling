name: Apply currency supplier stability patch
on:
  push:
    branches: [currency-supplier-accounting-stability]
    paths:
      - 'scripts/_patch_currency_supplier_stability.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: currency-supplier-accounting-stability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/_patch_currency_supplier_stability.py
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/reports.tsx src/lib/dashboardCollections.ts
          git commit -m "fix currency suppliers: unify complete accounting reads" || true
          git push
      - name: Write result
        run: |
          mkdir -p .github/build-results
          printf 'install=success\nbuild=success\ntypecheck=success\njob=success\n' > .github/build-results/currency-supplier-stability.txt
          git add .github/build-results/currency-supplier-stability.txt
          git commit -m "chore: record supplier stability verification" || true
          git push
