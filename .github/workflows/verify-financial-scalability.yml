name: Verify financial scalability hardening

on:
  pull_request:
    branches: [devo]
    paths:
      - 'src/lib/serverFinancialRead.ts'
      - 'src/lib/canonicalFinancialRead.ts'
      - 'supabase/migrations/**financial**.sql'
      - '.github/workflows/verify-financial-scalability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build
