name: Security phase 2 finalize

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-phase2-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - name: Apply already validated cleanup
        run: python scripts/security_phase2_cleanup.py
      - name: Verify exact scoped change
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "supabase/migrations/20260810200500_permission_aware_business_rls.sql "
          grep -q "merchant_cash_out_to_agent" supabase/migrations/20260810200500_permission_aware_business_rls.sql
          test "$(grep -c "CREATE POLICY transactions_perm_insert" supabase/migrations/20260810200500_permission_aware_business_rls.sql)" = "1"
          test "$(grep -c "CREATE POLICY company_transactions_perm_update" supabase/migrations/20260810200500_permission_aware_business_rls.sql)" = "1"
          ! grep -nE 'TO authenticated (USING|WITH CHECK) \(true\)' supabase/migrations/20260810200500_permission_aware_business_rls.sql
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build application
        run: bun run build
      - name: Commit on latest devo and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260810200500_permission_aware_business_rls.sql
          git commit -m "fix(security): clean generated posting RLS policies"
          # Build tools generate ignored/untracked output. Clean it before rebase.
          git reset --hard HEAD
          git clean -fdx
          git fetch origin devo
          git rebase origin/devo
          git push origin HEAD:devo
