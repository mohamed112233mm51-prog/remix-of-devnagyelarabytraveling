name: Verify agent period totals complete history

on:
  push:
    branches: [devo]
    paths:
      - 'src/hooks/useAgentPeriodTotals.ts'

permissions:
  contents: write

jobs:
  build-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Verify complete-history implementation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'range(from, from + PAGE_SIZE - 1)' src/hooks/useAgentPeriodTotals.ts
          grep -q 'from("transactions")' src/hooks/useAgentPeriodTotals.ts
          grep -q 'from("payment_splits")' src/hooks/useAgentPeriodTotals.ts
          ! grep -q 'useLive<Transaction>("transactions")' src/hooks/useAgentPeriodTotals.ts
          git diff --check

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
        run: bun run build

      - name: Cleanup verifier
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/routeTree.gen.ts || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-agent-period-totals.yml
          git commit -m 'chore: cleanup agent period totals verifier'
          git push origin devo
