name: Temporary final useLive audit

on:
  push:
    branches:
      - tmp-financial-summary-complete-loaders
  pull_request:
    branches:
      - accounting-scalability-integration

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-financial-summary-complete-loaders
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Patch dynamic financial engine reads
        run: python3 scripts/_tmp_patch_dynamic_financial_engine.py

      - name: Enforce useLive allowlist
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          allowed = {'agents', 'issuing_companies', 'merchants', 'investors', 'currency_suppliers', 'cash_boxes'}
          bad = []
          call_re = re.compile(r'useLive(?:<[^\n]*?>)?\s*\(')
          table_re = re.compile(r'\"([^\"]+)\"')

          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if not call_re.search(line):
                      continue
                  if 'function useLive' in line:
                      continue
                  snippet = ' '.join(lines[i:i+3])
                  m = table_re.search(snippet)
                  if not m or m.group(1) not in allowed:
                      bad.append(f'{path}:{i+1}: {snippet.strip()}')

          if bad:
              print('Disallowed/dynamic useLive calls remain:')
              print('\n'.join(bad))
              raise SystemExit(1)

          print('All remaining useLive calls are limited to master data or cash_boxes.')
          PY

      - name: Show remaining useLive calls
        shell: bash
        run: grep -RIn --include='*.ts' --include='*.tsx' 'useLive<' src || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Commit production patch
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/financialEngine.ts
          if git diff --cached --quiet; then
            echo 'No production patch to commit'
          else
            git commit -m "refactor financial engine: complete dynamic parent history"
            git push origin HEAD:tmp-financial-summary-complete-loaders
          fi
