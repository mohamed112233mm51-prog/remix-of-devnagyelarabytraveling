name: Verify agent accounting reconciliation

on:
  push:
    branches: [agents-accounting-stability]
    paths:
      - 'scripts/verify-agent-accounting-stability.ts'
      - '.github/workflows/verify-agent-accounting-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: install
        run: bun install --frozen-lockfile
      - id: reconcile
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: test-only-placeholder
        run: bun scripts/verify-agent-accounting-stability.ts
      - name: Record result
        if: always()
        shell: bash
        run: |
          mkdir -p .github/build-results
          {
            echo "commit=${GITHUB_SHA}"
            echo "install=${{ steps.install.outcome }}"
            echo "reconciliation=${{ steps.reconcile.outcome }}"
            echo "job=${{ job.status }}"
          } > .github/build-results/agent-accounting-reconciliation.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-results/agent-accounting-reconciliation.txt
          git commit -m 'ci: record agent accounting reconciliation result' || true
          git push origin HEAD:agents-accounting-stability
