name: Add cash box transfer

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/add-cashbox-transfer.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped treasury transfer feature
        run: python3 scripts/_patch_cashbox_transfer.py

      - name: Verify scoped diff
        shell: bash
        run: |
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'src/lib/financialEngine.ts' 'src/routes/reports.tsx' | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check
          grep -q 'postCashBoxTransfer' src/routes/reports.tsx
          grep -q 'checkOutflowAllowed' src/routes/reports.tsx
          grep -q 'cash_box_transfer' src/lib/financialEngine.ts

      - name: Commit feature and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/add-cashbox-transfer.yml scripts/_patch_cashbox_transfer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/financialEngine.ts src/routes/reports.tsx .github/workflows/add-cashbox-transfer.yml scripts/_patch_cashbox_transfer.py
          git diff --cached --check
          git commit -m "feat(treasury): add internal cash box transfers"
          git push origin devo
