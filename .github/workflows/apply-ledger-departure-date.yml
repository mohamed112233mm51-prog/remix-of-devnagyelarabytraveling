name: Apply ledger departure date columns

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/apply-ledger-departure-date.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Patch agent and company ledgers
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          agent_path = Path('src/components/AgentLedger.tsx')
          agent = agent_path.read_text(encoding='utf-8')

          agent = replace_once(
              agent,
              '  { key: "note", label: "ملاحظات" },\n  { key: "actions", label: "إجراءات" },',
              '  { key: "note", label: "ملاحظات" },\n  { key: "departureDate", label: "جهة المغادرة" },\n  { key: "actions", label: "إجراءات" },',
              'agent columns',
          )

          agent = replace_once(
              agent,
              '''  const rowsWithMethodLabel = useMemo(() => ledgerWithBalance.map((e) => ({\n    ...e,\n    methodLabel: e.paymentMethod,\n  })), [ledgerWithBalance]);''',
              '''  const executionTravelDateById = useMemo(() => new Map(\n    (Array.isArray(liveExecutions) ? liveExecutions : []).map((execution) => [\n      String(execution.id),\n      String((execution as any).travel_date || "").trim().slice(0, 10),\n    ]),\n  ), [liveExecutions]);\n\n  const rowsWithMethodLabel = useMemo(() => ledgerWithBalance.map((e) => {\n    const raw = e.raw as any;\n    const sourceRef = String(raw?.source_service_id || "");\n    const executionId = String(raw?.source_service_type || "") === "execution"\n      ? sourceRef.split("::")[0]\n      : "";\n    const departureDate = executionId ? (executionTravelDateById.get(executionId) || "—") : "—";\n    return {\n      ...e,\n      methodLabel: e.paymentMethod,\n      departureDate,\n    };\n  }), [ledgerWithBalance, executionTravelDateById]);''',
              'agent row enrichment',
          )

          agent = replace_once(
              agent,
              '{ header: "الرصيد الحالي", key: "balance" }, { header: "وسيلة الدفع", key: "method" }, { header: "ملاحظات", key: "note" },',
              '{ header: "الرصيد الحالي", key: "balance" }, { header: "وسيلة الدفع", key: "method" }, { header: "ملاحظات", key: "note" }, { header: "جهة المغادرة", key: "departureDate" },',
              'agent export columns',
          )

          agent = replace_once(
              agent,
              '      method: e.methodLabel, note: e.note,',
              '      method: e.methodLabel, note: e.note, departureDate: e.departureDate,',
              'agent export row',
          )

          agent = replace_once(
              agent,
              '                    {isVisible("note") && <Th filterKey="note">ملاحظات</Th>}\n                    {isVisible("actions") && <th>إجراءات</th>}',
              '                    {isVisible("note") && <Th filterKey="note">ملاحظات</Th>}\n                    {isVisible("departureDate") && <th>جهة المغادرة</th>}\n                    {isVisible("actions") && <th>إجراءات</th>}',
              'agent table header',
          )

          agent = replace_once(
              agent,
              '                      {isVisible("note") && <td data-label="ملاحظات">{e.note}</td>}\n                      {isVisible("actions") && (',
              '                      {isVisible("note") && <td data-label="ملاحظات">{e.note}</td>}\n                      {isVisible("departureDate") && <td data-label="جهة المغادرة">{e.departureDate}</td>}\n                      {isVisible("actions") && (',
              'agent table cell',
          )

          agent_path.write_text(agent, encoding='utf-8')

          company_path = Path('src/features/companies/LegacyCompaniesRoute.tsx')
          company = company_path.read_text(encoding='utf-8')

          company = replace_once(
              company,
              '  { key: "note", label: "ملاحظات" },\n  { key: "actions", label: "إجراءات" },',
              '  { key: "note", label: "ملاحظات" },\n  { key: "departureDate", label: "جهة المغادرة" },\n  { key: "actions", label: "إجراءات" },',
              'company columns',
          )

          company = replace_once(
              company,
              '''  const rowsWithMethodLabel = useMemo(() => allWithBalance.map((e) => ({\n    ...e,\n    methodLabel: e.paymentMethod,\n  })), [allWithBalance]);''',
              '''  const executionTravelDateById = useMemo(() => new Map(\n    (Array.isArray(liveExecutions) ? liveExecutions : []).map((execution) => [\n      String(execution.id),\n      String((execution as any).travel_date || "").trim().slice(0, 10),\n    ]),\n  ), [liveExecutions]);\n\n  const rowsWithMethodLabel = useMemo(() => allWithBalance.map((e) => {\n    const raw = e.raw as any;\n    const sourceRef = String(raw?.source_service_id || "");\n    const executionId = String(raw?.source_service_type || "") === "execution"\n      ? sourceRef.split("::")[0]\n      : "";\n    const departureDate = executionId ? (executionTravelDateById.get(executionId) || "—") : "—";\n    return {\n      ...e,\n      methodLabel: e.paymentMethod,\n      departureDate,\n    };\n  }), [allWithBalance, executionTravelDateById]);''',
              'company row enrichment',
          )

          company = replace_once(
              company,
              '{ header: "الرصيد الحالي", key: "balance" }, { header: "وسيلة الدفع", key: "method" }, { header: "ملاحظات", key: "note" },',
              '{ header: "الرصيد الحالي", key: "balance" }, { header: "وسيلة الدفع", key: "method" }, { header: "ملاحظات", key: "note" }, { header: "جهة المغادرة", key: "departureDate" },',
              'company export columns',
          )

          company = replace_once(
              company,
              '      method: e.methodLabel, note: e.note,',
              '      method: e.methodLabel, note: e.note, departureDate: e.departureDate,',
              'company export row',
          )

          company = replace_once(
              company,
              '                {isVisible("note") && <Th filterKey="note">ملاحظات</Th>}\n                {isVisible("actions") && <th>إجراءات</th>}',
              '                {isVisible("note") && <Th filterKey="note">ملاحظات</Th>}\n                {isVisible("departureDate") && <th>جهة المغادرة</th>}\n                {isVisible("actions") && <th>إجراءات</th>}',
              'company table header',
          )

          company = replace_once(
              company,
              '                  {isVisible("note") && <td data-label="ملاحظات">{e.note}</td>}\n                  {isVisible("actions") && (',
              '                  {isVisible("note") && <td data-label="ملاحظات">{e.note}</td>}\n                  {isVisible("departureDate") && <td data-label="جهة المغادرة">{e.departureDate}</td>}\n                  {isVisible("actions") && (',
              'company table cell',
          )

          company_path.write_text(company, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-ledger-departure-date.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AgentLedger.tsx src/features/companies/LegacyCompaniesRoute.tsx .github/workflows/apply-ledger-departure-date.yml
          git diff --cached --check
          git commit -m "feat(ledger): show execution departure date [skip ci]"
          git push origin devo
