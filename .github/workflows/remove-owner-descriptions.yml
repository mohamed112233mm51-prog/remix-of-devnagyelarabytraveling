name: Remove owner descriptions

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/remove-owner-descriptions.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped text cleanup
        run: python3 scripts/remove-owner-descriptions.py

      - name: Verify whitespace
        run: git diff --check

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
        run: bun run build

      - name: Commit scoped cleanup
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/routeTree.gen.ts || true
          unexpected="$(git diff --name-only | grep -Ev '^(src/routes/investors\.tsx|src/components/FinancialPositionPanel\.tsx)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed files:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/investors.tsx src/components/FinancialPositionPanel.tsx
          git rm .github/workflows/remove-owner-descriptions.yml scripts/remove-owner-descriptions.py
          git diff --cached --check
          git commit -m 'fix(owner-account): remove explanatory descriptions'
          git push origin devo
