name: Apply atomic core financial flows

on:
  push:
    branches: [devo]
    paths:
      - scripts/_patch_financial_atomic_core_flows.py
      - .github/workflows/apply-financial-atomic-core-flows.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply atomic core flow patch
        run: python3 scripts/_patch_financial_atomic_core_flows.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit atomic core flows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AgentPaymentForm.tsx src/components/CashMovementForms.tsx src/features/expenses/LegacyExpensesRoute.tsx
          if git diff --cached --quiet; then
            echo "No core-flow changes to commit"
          else
            git commit -m "Make core financial saves database-atomic"
            git pull --rebase origin devo
            git push origin devo
          fi
