name: Security uuid trace

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-uuid-trace.yml'

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
      - uses: oven-sh/setup-bun@v2
      - name: Recreate validated fresh-lock candidate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json'); d=json.loads(p.read_text())
          d['dependencies']['xlsx']='https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz'
          d['dependencies']['@cloudflare/vite-plugin']='^1.51.2'
          d['dependencies']['@supabase/supabase-js']='^2.112.2'
          d['dependencies']['nitro']='3.0.260610-beta'
          d['devDependencies']['@lovable.dev/vite-tanstack-config']='2.10.0'
          d['devDependencies']['vite']='^7.3.6'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          rm -rf node_modules bun.lock
          bun install
      - name: Trace uuid versions and parents
        run: |
          echo '=== bun pm why uuid ==='
          bun pm why uuid || true
          echo '=== uuid entries in lock ==='
          grep -n '"uuid"' bun.lock | head -100 || true
      - name: Print uuid advisory details
        run: |
          set +e
          bun audit --json > /tmp/audit.json 2>/tmp/audit.err
          node - <<'JS'
          const fs=require('fs'); let d={};
          try{d=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'))}catch(e){console.error(e);process.exit(0)}
          console.log(JSON.stringify(d.uuid || [], null, 2));
          JS
          cat /tmp/audit.err || true
          exit 0
