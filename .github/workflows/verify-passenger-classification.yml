name: Verify passenger classification

on:
  push:
    branches: [devo]
  pull_request:
    branches: [devo]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Mapping, automatic pricing, execution form, OCR and Excel regression tests
        run: node --experimental-strip-types --test tests/passengerClassification.test.ts tests/passengerClassificationFlows.test.mjs tests/passengerClassificationIO.test.mjs tests/executionServicePricing.test.mjs
      - name: Type check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
