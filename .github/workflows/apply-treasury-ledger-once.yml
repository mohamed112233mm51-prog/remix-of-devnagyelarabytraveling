name: Apply treasury ledger integration once

on:
  push:
    branches:
      - devo
    paths:
      - ".github/workflows/apply-treasury-ledger-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Patch treasury report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/routes/reports.tsx")
          text = path.read_text(encoding="utf-8")

          import_line = 'import { TreasuryMovementLedger } from "@/components/TreasuryMovementLedger";'
          import_anchor = 'import { AppErrorBoundary } from "@/components/AppErrorBoundary";'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit("Treasury ledger import anchor not found")
              text = text.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          render_line = '        <TreasuryMovementLedger boxes={boxes} inRange={inRange} />'
          render_anchor = '        {editBox && <CashBoxOpeningModal box={editBox} onClose={() => setEditBox(null)} />}'
          if render_line not in text:
              if render_anchor not in text:
                  raise SystemExit("Treasury ledger render anchor not found")
              text = text.replace(render_anchor, render_line + "\n\n" + render_anchor, 1)

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/apply-treasury-ledger-once.yml").unlink()
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show complete treasury movement ledger in reports"
          git push origin HEAD:devo
