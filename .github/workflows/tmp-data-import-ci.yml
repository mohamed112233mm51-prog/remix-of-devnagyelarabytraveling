name: Temporary data import CI

on:
  push:
    branches: [devo]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: TypeScript check
        run: npx tsc --noEmit
