name: Remove treasury history user UI

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/remove-treasury-history-user-ui.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped patch
        run: python scripts/remove_treasury_history_user_ui.py

      - name: Verify scoped diff
        run: |
          git diff --check
          git diff --name-only
          test "$(git diff --name-only | tr '\n' ' ')" = "src/routes/reports.tsx "

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Commit scoped change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/reports.tsx
          git commit -m "fix(reports): remove treasury history user column and filter"
          git push origin devo
