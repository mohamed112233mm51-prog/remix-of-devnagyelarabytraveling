name: Security phase 1

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-phase1.yml'

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped security patch
        run: python scripts/security_phase1_patch.py

      - name: Verify scoped diff and secret removal
        run: |
          git diff --check
          printf '%s\n' "$(git diff --name-only)"
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/lib/admin.functions.ts src/routes/api/public/hooks/backup.ts "
          ! grep -R "BOOTSTRAP_PASSWORD\|bootstrapAdmin" src/lib/admin.functions.ts
          ! grep -E "SUPABASE_(PUBLISHABLE|ANON)_KEY" src/routes/api/public/hooks/backup.ts
          grep -q "BACKUP_CRON_SECRET" src/routes/api/public/hooks/backup.ts

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Commit scoped security patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/admin.functions.ts src/routes/api/public/hooks/backup.ts
          git commit -m "fix(security): remove admin bootstrap and secure backup webhook"
          git push origin devo
