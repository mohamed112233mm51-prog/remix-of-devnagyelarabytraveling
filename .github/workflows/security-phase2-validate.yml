name: Security phase 2 validate

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/security-phase2-validate.yml'

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply compatibility patch
        run: python scripts/security_phase2_patch.py

      - name: Verify scoped diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "src/routes/reports.tsx supabase/migrations/20260810200500_permission_aware_business_rls.sql "
          ! grep -nE 'TO authenticated (USING|WITH CHECK) \(true\)' supabase/migrations/20260810200500_permission_aware_business_rls.sql
          grep -q 'SECURITY INVOKER' supabase/migrations/20260810200500_permission_aware_business_rls.sql
          grep -q 'app_payment_split_write_allowed(source_table, source_id' supabase/migrations/20260810200500_permission_aware_business_rls.sql

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client >/dev/null

      - name: Create minimal security schema
        env:
          PGPASSWORD: postgres
        run: |
          cat > /tmp/security_prelude.sql <<'SQL'
          CREATE SCHEMA auth;
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;

          CREATE TYPE public.app_role AS ENUM ('admin','manager','user');

          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;

          CREATE TABLE public.profiles (
            id uuid PRIMARY KEY,
            is_active boolean NOT NULL DEFAULT true,
            invite_accepted boolean NOT NULL DEFAULT true,
            is_super_admin boolean NOT NULL DEFAULT false,
            permissions jsonb NOT NULL DEFAULT '{}'::jsonb
          );
          CREATE TABLE public.user_roles (
            user_id uuid NOT NULL,
            role public.app_role NOT NULL
          );

          CREATE OR REPLACE FUNCTION public.has_role(_user_id uuid, _role public.app_role)
          RETURNS boolean LANGUAGE sql STABLE SECURITY DEFINER SET search_path=public AS $$
            SELECT EXISTS(SELECT 1 FROM public.user_roles WHERE user_id=_user_id AND role=_role)
          $$;

          CREATE TABLE public.agents (id uuid PRIMARY KEY);
          CREATE TABLE public.issuing_companies (id uuid PRIMARY KEY);
          CREATE TABLE public.merchants (id uuid PRIMARY KEY);
          CREATE TABLE public.currency_suppliers (id uuid PRIMARY KEY);
          CREATE TABLE public.investors (id uuid PRIMARY KEY);
          CREATE TABLE public.transactions (
            id uuid PRIMARY KEY,
            agent_id uuid,
            merchant_id uuid,
            source_service_type text,
            source_service_id text
          );
          CREATE TABLE public.company_transactions (
            id uuid PRIMARY KEY,
            source_service_type text,
            source_service_id text
          );
          CREATE TABLE public.merchant_cash_collections (
            id uuid PRIMARY KEY,
            source_service_type text,
            expense_id uuid
          );
          CREATE TABLE public.currency_supplier_transactions (
            id uuid PRIMARY KEY,
            source_service_type text
          );
          CREATE TABLE public.investor_transactions (id uuid PRIMARY KEY);
          CREATE TABLE public.expenses (id uuid PRIMARY KEY);
          CREATE TABLE public.expense_deductions (id uuid PRIMARY KEY);
          CREATE TABLE public.usd_treasury_transactions (id uuid PRIMARY KEY, type text);
          CREATE TABLE public.submissions (id uuid PRIMARY KEY);
          CREATE TABLE public.executions (id uuid PRIMARY KEY);
          CREATE TABLE public.payment_splits (
            id uuid PRIMARY KEY,
            source_table text,
            source_id uuid
          );
          CREATE TABLE public.cash_boxes (id uuid PRIMARY KEY, balance numeric NOT NULL DEFAULT 0);
          CREATE TABLE public.company_pricing_rules (id uuid PRIMARY KEY);

          CREATE OR REPLACE FUNCTION public.apply_payment_split_to_cash_box()
          RETURNS trigger LANGUAGE plpgsql SET search_path=public AS $$ BEGIN RETURN NEW; END $$;
          CREATE OR REPLACE FUNCTION public.enforce_cash_box_non_negative_balance()
          RETURNS trigger LANGUAGE plpgsql SET search_path=public AS $$ BEGIN RETURN NEW; END $$;
          CREATE OR REPLACE FUNCTION public.enforce_cash_box_non_negative_balance_ins()
          RETURNS trigger LANGUAGE plpgsql SET search_path=public AS $$ BEGIN RETURN NEW; END $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d security_test -v ON_ERROR_STOP=1 -f /tmp/security_prelude.sql

      - name: Apply RLS migration to PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d security_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260810200500_permission_aware_business_rls.sql

      - name: Verify permission helper behavior and policy hardening
        env:
          PGPASSWORD: postgres
        run: |
          cat > /tmp/security_assert.sql <<'SQL'
          INSERT INTO public.profiles(id,is_active,invite_accepted,is_super_admin,permissions) VALUES
            ('11111111-1111-4111-8111-111111111111',true,true,false,'{"accounts":{"view":true,"create":false}}'),
            ('22222222-2222-4222-8222-222222222222',false,true,false,'{"accounts":true}'),
            ('33333333-3333-4333-8333-333333333333',true,true,false,'{}');
          INSERT INTO public.user_roles(user_id,role) VALUES
            ('33333333-3333-4333-8333-333333333333','admin');

          DO $$
          BEGIN
            PERFORM set_config('request.jwt.claim.sub','11111111-1111-4111-8111-111111111111',false);
            IF NOT public.app_permission_allowed('accounts','view') THEN RAISE EXCEPTION 'accounts view should be allowed'; END IF;
            IF public.app_permission_allowed('companies','view') THEN RAISE EXCEPTION 'companies view should be denied'; END IF;
            IF public.app_permission_allowed('accounts','create') THEN RAISE EXCEPTION 'accounts create should be denied'; END IF;

            PERFORM set_config('request.jwt.claim.sub','22222222-2222-4222-8222-222222222222',false);
            IF public.app_permission_allowed('accounts','view') THEN RAISE EXCEPTION 'disabled user should be denied'; END IF;

            PERFORM set_config('request.jwt.claim.sub','33333333-3333-4333-8333-333333333333',false);
            IF NOT public.app_permission_allowed('companies','delete') THEN RAISE EXCEPTION 'admin bypass should be allowed'; END IF;
          END $$;

          DO $$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n
            FROM pg_policies
            WHERE schemaname='public'
              AND tablename = ANY(ARRAY[
                'agents','issuing_companies','merchants','currency_suppliers','investors',
                'transactions','company_transactions','merchant_cash_collections',
                'currency_supplier_transactions','investor_transactions','expenses',
                'expense_deductions','usd_treasury_transactions','submissions','executions',
                'payment_splits','cash_boxes','company_pricing_rules'
              ])
              AND (trim(COALESCE(qual,'')) = 'true' OR trim(COALESCE(with_check,'')) = 'true');
            IF n <> 0 THEN RAISE EXCEPTION 'broad true RLS policies remain: %', n; END IF;
          END $$;

          DO $$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM pg_proc
            WHERE proname IN ('app_permission_allowed','app_has_any_permission','app_financial_action_allowed','app_payment_split_write_allowed')
              AND prosecdef = true;
            IF n <> 0 THEN RAISE EXCEPTION 'permission helper unexpectedly SECURITY DEFINER'; END IF;
          END $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d security_test -v ON_ERROR_STOP=1 -f /tmp/security_assert.sql

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Commit validated phase 2 changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/reports.tsx supabase/migrations/20260810200500_permission_aware_business_rls.sql
          git commit -m "fix(security): enforce permission-aware RLS"
          git push origin devo
