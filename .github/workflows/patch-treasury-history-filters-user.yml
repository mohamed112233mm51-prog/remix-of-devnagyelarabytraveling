name: Patch treasury history filters and user

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/patch-treasury-history-filters-user.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Apply scoped patch
        run: python3 scripts/_patch_treasury_history_filters_user.py

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src/routes/reports.tsx"
          grep -q 'فلتر المستخدم' src/routes/reports.tsx
          grep -q 'performedByLabel' src/routes/reports.tsx
          grep -q 'financial_audit_log' src/routes/reports.tsx
          grep -q 'مسح الفلاتر' src/routes/reports.tsx

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
        run: bun run build

      - name: Commit scoped feature
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- src/routeTree.gen.ts || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/reports.tsx
          git rm .github/workflows/patch-treasury-history-filters-user.yml scripts/_patch_treasury_history_filters_user.py
          git diff --cached --check
          git commit -m 'feat(reports): add treasury history filters and operator'
          git push origin devo
