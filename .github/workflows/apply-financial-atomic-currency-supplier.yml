name: Apply atomic currency supplier financial flows

on:
  push:
    branches: [devo]
    paths:
      - scripts/_patch_financial_atomic_currency_supplier.py
      - .github/workflows/apply-financial-atomic-currency-supplier.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply currency supplier atomic patch
        run: python3 scripts/_patch_financial_atomic_currency_supplier.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit currency supplier atomic flow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/currency-suppliers/LegacyCurrencySupplierStatementRoute.tsx
          if git diff --cached --quiet; then
            echo "No currency-supplier changes to commit"
          else
            git commit -m "Make currency supplier saves database-atomic"
            git pull --rebase origin devo
            git push origin devo
          fi
