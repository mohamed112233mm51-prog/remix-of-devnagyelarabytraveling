name: Clean incidental direct-transfer lockfile drift

on:
  push:
    branches: [devo]
    paths:
      - .github/workflows/cleanup-direct-transfer-lock.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - name: Restore pre-change lockfile and remove one-shot workflow
        run: |
          git checkout bbc3a57408cd12c7b867b3e33bdb7ac3b3031a14 -- package-lock.json
          git rm .github/workflows/cleanup-direct-transfer-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Remove incidental lockfile drift"
          git push origin HEAD:devo
