name: Apply departure date statement filter

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/apply-departure-date-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Patch agent and company statements only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)

          files = [
              Path('src/components/AgentLedger.tsx'),
              Path('src/features/companies/LegacyCompaniesRoute.tsx'),
          ]

          for p in files:
              s = p.read_text(encoding='utf-8')
              tag = p.name

              s = once(
                  s,
                  '{ key: "departureDate", label: "جهة المغادرة" },',
                  '{ key: "departureDate", label: "تاريخ المغادرة" },',
                  f'{tag} column label',
              )

              s = once(
                  s,
                  '    note: CF.emptyText(),\n  });',
                  '    note: CF.emptyText(),\n    departureDate: CF.emptyDateRange(),\n  });',
                  f'{tag} departure filter state',
              )

              s = once(
                  s,
                  '    if (!CF.matchText(e.note, safeFilters.note)) return false;\n    return true;',
                  '    if (!CF.matchText(e.note, safeFilters.note)) return false;\n    if (CF.isFilterActive(safeFilters.departureDate) && (!e.departureDate || e.departureDate === "—")) return false;\n    if (!CF.matchDateRange(e.departureDate === "—" ? "" : e.departureDate, safeFilters.departureDate)) return false;\n    return true;',
                  f'{tag} departure filter matching',
              )

              s = once(
                  s,
                  '{ header: "جهة المغادرة", key: "departureDate" }',
                  '{ header: "تاريخ المغادرة", key: "departureDate" }',
                  f'{tag} export header',
              )

              s = once(
                  s,
                  '{isVisible("departureDate") && <th>جهة المغادرة</th>}',
                  '{isVisible("departureDate") && <Th filterKey="departureDate">تاريخ المغادرة</Th>}',
                  f'{tag} table header filter',
              )

              s = once(
                  s,
                  '{isVisible("departureDate") && <td data-label="جهة المغادرة">{e.departureDate}</td>}',
                  '{isVisible("departureDate") && <td data-label="تاريخ المغادرة">{e.departureDate}</td>}',
                  f'{tag} cell label',
              )

              p.write_text(s, encoding='utf-8')
          PY

      - name: Verify scoped diff
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          expected=$'src/components/AgentLedger.tsx\nsrc/features/companies/LegacyCompaniesRoute.tsx'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git diff --check

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-departure-date-filter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/AgentLedger.tsx src/features/companies/LegacyCompaniesRoute.tsx .github/workflows/apply-departure-date-filter.yml
          git diff --cached --check
          git commit -m "feat(statements): filter and rename departure date column [skip ci]"
          git push origin devo
