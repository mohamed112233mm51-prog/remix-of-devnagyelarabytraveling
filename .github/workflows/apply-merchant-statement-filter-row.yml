name: Apply merchant statement filter row layout

on:
  push:
    branches: [devo]
    paths:
      - '.github/workflows/apply-merchant-statement-filter-row.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0

      - name: Patch merchant statement filter layout only
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/features/merchants/LegacyMerchantsRoute.tsx')
          s = p.read_text(encoding='utf-8')
          old = '<div className="form-grid" style={{ marginBottom: 12 }}>'
          new = '<div className="form-grid" style={{ marginBottom: 12, gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))" }}>'
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'expected exactly 1 merchant statement filter grid, found {n}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-merchant-statement-filter-row.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/merchants/LegacyMerchantsRoute.tsx .github/workflows/apply-merchant-statement-filter-row.yml
          git diff --cached --check
          git commit -m "fix(merchant-statement): keep primary filters on one row [skip ci]"
          git push origin devo
