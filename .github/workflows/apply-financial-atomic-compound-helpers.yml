name: Apply remaining compound atomic financial flows

on:
  push:
    branches: [devo]
    paths:
      - scripts/_patch_financial_atomic_compound_helpers.py
      - .github/workflows/apply-financial-atomic-compound-helpers.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply compound atomic patches
        run: python3 scripts/_patch_financial_atomic_compound_helpers.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit compound atomic flows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/expenses/LegacyExpensesRoute.tsx src/lib/openingBalance.ts src/lib/servicePosting.ts src/lib/approvalFines.ts
          if git diff --cached --quiet; then
            echo "No compound-flow changes to commit"
          else
            git commit -m "Make remaining compound financial writes atomic"
            git pull --rebase origin devo
            git push origin devo
          fi
