name: Apply atomic company and merchant financial flows

on:
  push:
    branches: [devo]
    paths:
      - scripts/_patch_financial_atomic_company_merchant.py
      - .github/workflows/apply-financial-atomic-company-merchant.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: devo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply company and merchant atomic patch
        run: python3 scripts/_patch_financial_atomic_company_merchant.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Commit company and merchant atomic flows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/companies/LegacyCompaniesRoute.tsx src/features/merchants/LegacyMerchantsRoute.tsx src/features/currency-suppliers/LegacyCurrencySupplierStatementRoute.tsx
          if git diff --cached --quiet; then
            echo "No company/merchant changes to commit"
          else
            git commit -m "Make company and merchant saves database-atomic"
            git pull --rebase origin devo
            git push origin devo
          fi
